[project]
name = "textbook-parser"
version = "0.1.0"
description = "Offline review-first chess textbook extraction helpers"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "Pillow>=10",
]

[project.scripts]
textbook-parser = "textbook_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
